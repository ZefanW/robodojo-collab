[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robodojo-collab"
version = "0.1.0"
description = "Auditable decentralized RoboDojo result contribution tools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
robodojo-collab = "robodojo_collab.cli:main"

[tool.setuptools.packages.find]
include = ["robodojo_collab*"]
